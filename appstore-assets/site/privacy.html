  <h1>CloudDreamMarkdown 隐私政策</h1>
  <p>生效日期：2026 年 5 月 27 日</p>
  <p>CloudDreamMarkdown 不要求用户注册或登录账号。</p>
  <p>当前版本不会收集、上传、出售或共享用户的个人数据。应用用于打开和编辑用户主动选择的本地 Markdown 文档，文档内容不会被发送到开发者服务器。</p>
  <p>如果未来版本新增会收集数据的功能，我们会在发布前更新本隐私政策，并在 App Store Connect 中同步更新隐私信息。</p>
  <h2>联系我们</h2>
  <p>如有隐私相关问题，请发送邮件至 abcjxp@126.com 联系开发者。</p>
